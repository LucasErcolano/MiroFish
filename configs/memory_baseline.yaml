# =============================================================================
# S2 Memory Config — Baseline (Zep-based)
# =============================================================================
# This config activates the baseline memory system (Zep).
# No code changes needed — MEMORY_MODE=baseline is the default.
#
# Usage:
#   python scripts/run_experiment.py --config configs/memory_baseline.yaml --dry-run
# =============================================================================

# Reproduce the baseline memory behavior with deterministic seed
case_id: memory_smoke_test
variant: baseline
seed: 1
memory_mode: baseline

max_rounds: 3
platform: parallel
parallel_profile_count: 3

simulation_requirement: |
  Smoke test for baseline memory mode.
  Simple scenario to verify Zep-based memory works end-to-end.

# No seed documents for smoke test — the backend will use the requirement only
seed_documents: []
prompts: []

enable_graph_memory_update: true
generate_report: true
force: true
use_llm_for_profiles: true
poll_timeout_seconds: 1800

extra_env:
  MEMORY_MODE: baseline
  USE_EXPERIMENTAL_MEMORY: "false"

runs_root: runs