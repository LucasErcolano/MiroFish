# Per-model price table for LLM cost estimation (Issue #21 observability).
#
# Units: USD per 1,000 tokens. `in` = prompt tokens, `out` = completion tokens.
# Lookup is by exact model name, then case-insensitive, then prefix match.
# Unknown models estimate cost 0.0 and raise a `cost_unknown_model` leak flag in
# the telemetry record so missing entries are auditable rather than silent.
#
# Local / self-hosted models are priced at 0.0 (no per-token vendor cost).

version: 1

prices:
  # OpenAI
  gpt-4o-mini:        { in: 0.00015, out: 0.0006 }
  gpt-4o:             { in: 0.0025,  out: 0.01 }
  gpt-4.1-mini:       { in: 0.0004,  out: 0.0016 }

  # Local / OpenAI-compatible (vLLM, lmstudio) — no vendor cost
  qwen2.5-7b-instruct-awq:        { in: 0.0, out: 0.0 }
  mistral-7b-instruct-v0.3-awq:   { in: 0.0, out: 0.0 }
