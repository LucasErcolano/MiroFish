# =============================================================================
# S2 Experiment Config — Example Case
# =============================================================================
# This is a template for S2 reproducible experiments.
# Copy this file and customize for your specific case.
#
# A researcher can run baseline vs experimental by changing ONLY
# the `variant` and `memory_mode` fields.
#
# Usage:
#   python scripts/run_experiment.py --config configs/experiments/example_case.yaml --dry-run
#   python scripts/run_experiment.py --config configs/experiments/example_case.yaml
# =============================================================================

# Required: unique identifier for the case
case_id: example_case

# Required: variant label — "baseline" or "experimental" (or "memory", "multimodel")
# Change this to "experimental" to test the experimental memory system.
variant: baseline

# Required: random seed for deterministic reproducibility
seed: 1

# Memory mode: "baseline" (Zep) or "experimental" (ChromaDB dual-layer)
# This maps to MEMORY_MODE env var when running.
memory_mode: baseline

# Simulation config
max_rounds: 10
platform: parallel  # "parallel", "twitter", or "reddit"
parallel_profile_count: 5

# LLM config (optional overrides)
# model: gemini-2.5-flash-lite
# llm_base_url: https://generativelanguage.googleapis.com/v1beta/openai/
# llm_api_key_env: LLM_API_KEY  # env var name containing the key; never put keys in YAML

# Simulation requirement (the question/prompt for MiroFish)
# Can be inline or reference a file:
simulation_requirement: |
  Analyze the Argentine presidential election of 2023.
  Given the available evidence, assess the most likely outcome and
  explain the causal mechanisms driving voter behavior.

# Seed documents — files that provide evidence to MiroFish
# Each entry has a path (relative to project root) and an alias.
seed_documents:
  - path: runs/headless/PILOT-ARG-2025-Q1-input/seed_bundle.md
    alias: seed_bundle_T0

# Prompts/questions — can reference files or contain inline text
prompts:
  - path: runs/headless/PILOT-ARG-2025-Q1-input/prompt.md
    alias: main_question

# Graph memory
enable_graph_memory_update: true
generate_report: true

# Run control
force: true
use_llm_for_profiles: true
poll_timeout_seconds: 3600

# Extra environment variables (non-secret values only)
extra_env: {}

# Output root
runs_root: runs