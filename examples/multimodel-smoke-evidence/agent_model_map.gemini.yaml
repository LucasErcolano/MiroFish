# Real 2-model smoke against the Gemini OpenAI-compatible endpoint.
# No GPU needed: both models are served by the same endpoint; the split
# proves per-agent routing + per-call telemetry with two real models.
version: 1
default:
  provider: openai
  model: gemini-3.1-flash-lite
  base_url_env: LLM_BASE_URL
  api_key_env: LLM_API_KEY
  temperature: 0.7
fallback:
  enabled: false
by_agent_id:
  0: { model: gemini-2.5-flash-lite }
  1: { model: gemini-2.5-flash-lite }
  2: { model: gemini-2.5-flash-lite }
  3: { model: gemini-2.5-flash-lite }
  4: { model: gemini-2.5-flash-lite }
  5: { model: gemini-2.5-flash-lite }
  6: { model: gemini-2.5-flash-lite }
  7: { model: gemini-2.5-flash-lite }
  8: { model: gemini-2.5-flash-lite }
  9: { model: gemini-2.5-flash-lite }
