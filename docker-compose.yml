services:
  mirofish:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ALLOW_UNCONFIGURED_STARTUP: ${ALLOW_UNCONFIGURED_STARTUP:-true}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      VITE_OPEN_BROWSER: "false"
      GRAPHITI_URI: ${GRAPHITI_URI:-bolt://neo4j:7687}
      GRAPHITI_USER: ${GRAPHITI_USER:-neo4j}
      GRAPHITI_PASSWORD: ${GRAPHITI_PASSWORD:-mirofishpassword}
      GRAPHITI_DATABASE: ${GRAPHITI_DATABASE:-neo4j}
    ports:
      - "3000:3000"
      - "5001:5001"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/data:/app/backend/data
      - ./outputs:/app/outputs
    init: true
    mem_limit: 6g
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  neo4j:
    image: neo4j:5.23-community
    profiles:
      - graphiti
    environment:
      NEO4J_AUTH: neo4j/${GRAPHITI_PASSWORD:-mirofishpassword}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    mem_limit: 2g
    stop_grace_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
