# MiroFish Phase 2 (S2) - Line 5 Configuration Matrix (FINAL COMPLIANCE)
# Closes #18, Resolves #11, Resolves #22

experiment_metadata:
  phase: "S2"
  target_case: "CASE-B2-ARG-IPC-2025"
  project_id: "proj_arg_ipc_2025"
  primary_metric: "MAE (Mean Absolute Error)"

# Primary Fixed Model (Standard for R/D Matrix)
baseline_model: "Llama 3.3 70B Instruct"

# Model Ladder (Calibration / Sanity Check - Exact names per Issue #18)
model_ladder:
  - "Qwen3 8B"
  - "Gemma 3 27B IT"
  - "Llama 3.3 70B Instruct"

# Experimental Conditions (Line 5: Depth & Density)
line5_conditions:
  - id: "R10-D2"
    rounds: 10
    density: 2
    label: "Low Depth"
  - id: "R40-D2" # BASELINE
    rounds: 40
    density: 2
    label: "Standard Depth"
  - id: "R80-D2" # BEST CONDITION
    rounds: 80
    density: 2
    label: "High Depth (Saturation Test)"
  - id: "R40-D1"
    rounds: 40
    density: 1
    label: "High Density"
  - id: "R40-D3"
    rounds: 40
    density: 3
    label: "Low Density"

# Robustness Requirement
best_condition_replicas: 3
best_condition_id: "R80-D2"

# Pricing Table (USD per 1M tokens) - Mapping Issue names to Provider IDs
pricing:
  "Llama 3.3 70B Instruct": {provider_id: "meta-llama/llama-3.3-70b-instruct", input: 0.10, output: 0.32}
  "Qwen3 8B": {provider_id: "qwen/qwen-2.5-7b-instruct", input: 0.05, output: 0.40}
  "Gemma 3 27B IT": {provider_id: "gemma/gemma-2-27b-it", input: 0.08, output: 0.16}
