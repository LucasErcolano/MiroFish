name: Stable Fork CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.9.26

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend
          uv sync --project backend --frozen --python 3.11

      - name: Verify stable fork
        run: npm run check

      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
