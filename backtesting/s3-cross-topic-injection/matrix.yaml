version: 3
case_id: s3-cross-topic-injection
rounds: 20
platform: reddit
accept_language: es
smoke_conditions:
  - baseline-control
  - signal-mid
conditions:
  - id: baseline-control
    role: control
    timing: none
    event_expected: 0
  - id: signal-early
    role: signal
    timing: early
    event_expected: 1
  - id: signal-mid
    role: signal
    timing: mid
    event_expected: 1
  - id: signal-late
    role: signal
    timing: late
    event_expected: 1
  - id: counter-signal-mid
    role: counter_signal
    timing: mid
    event_expected: 1
  - id: noise-near-mid
    role: near_noise
    timing: mid
    event_expected: 1
  - id: noise-off-mid
    role: off_noise
    timing: mid
    event_expected: 1
round_policy:
  early_pct: 0.10
  mid_pct: 0.50
  late_pct: 0.90
models:
